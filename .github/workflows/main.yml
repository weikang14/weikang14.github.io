name: Keep HF Space Alive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write   # 必须加，keepalive 需要这个权限

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping HF Space
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L https://cwk14-gold-manus-ai.hf.space/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Space might be sleeping, status: $STATUS"
          else
            echo "✅ Space is alive"
          fi

      # 防止 GitHub 因为 60 天无 commit 自动禁用此 workflow
      - uses: gautamkrishnar/keepalive-workflow@v2
