name: Keep HF Space Alive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space (keep awake)
        run: |
          echo "Pinging HF Space..."
          curl -L -s -o /dev/null https://cwk14-gold-manus-ai.hf.space/
          echo "Ping sent successfully"

      - name: Keep workflow alive (prevent 60-day auto-disable)
        run: |
          echo "Re-enabling workflow to prevent auto-disable..."
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hflive.yml/enable"
          echo "Workflow keep-alive complete"
