name: Restart HF Spaces

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:

      - name: Restart HF Space
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
          https://huggingface.co/api/spaces/cwk14/gold-manus-ai/restart

      - name: Wait
        run: sleep 20

      - name: Check
        run: curl -I https://cwk14-gold-manus-ai.hf.space/ || true
