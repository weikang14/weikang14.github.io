name: Restart HF Spaces

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Restart
        run: |
          curl -L --retry 5 --retry-delay 5 \
          "https://cwk14-gold-manus-ai.hf.space/?restart=$(date +%s)" || true

      - name: Wait
        run: sleep 30

      - name: Check
        run: curl -I https://cwk14-gold-manus-ai.hf.space/ || true
